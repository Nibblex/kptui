# Existing KDBX database to open (or new database to create),
# or a remote one on an SFTP server, like "sftp://me@nas/~/vault.kdbx"
database = "~/.local/share/kptui/default.kdbx"

# Optional KeePass keyfile [empty for password-only vaults]
keyfile = "~/.local/share/kptui/default.keyx"

# Argon2 KDF iterations (time cost) [default: 90]
kdf_iterations = 90

# Argon2 memory (M here means multiples of 1024 * 1024 bytes)
kdf_memory = "256M"

# Seconds of inactivity before exiting the app [0: never auto-exit]
auto_exit = 300

# Name of a theme installed in ~/.config/kptui/themes/
theme = "mélange_dark"

# Inside tmux, Ctrl-y on an entry copies the selected field to a tmux paste buffer
tmux_copy = false

# Seconds before tmux deletes the copied value [at least 1]
tmux_clear = 30
